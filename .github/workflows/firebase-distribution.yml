name: Mobile CI/CD (Push -> Test Distribution -> Manual Production)

on:
  workflow_dispatch:
  push:
    branches:
      - v2
      - main

permissions:
  contents: read

concurrency:
  group: mobile-cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare Canonical Build Metadata
    runs-on: ubuntu-latest
    outputs:
      ci_build_number: ${{ steps.meta.outputs.ci_build_number }}
      app_version: ${{ steps.meta.outputs.app_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute build metadata
        id: meta
        run: |
          VERSION_LINE="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          APP_VERSION="${VERSION_LINE%%+*}"
          CI_BUILD_NUMBER="$(date +%s)"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "ci_build_number=$CI_BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          mkdir -p ci_meta
          cat > ci_meta/build_manifest.json <<EOF
          {
            "ci_build_number": "$CI_BUILD_NUMBER",
            "app_version": "$APP_VERSION",
            "commit_sha": "${GITHUB_SHA}",
            "git_ref": "${GITHUB_REF}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_attempt": "${GITHUB_RUN_ATTEMPT}"
          }
          EOF

      - name: Upload canonical manifest
        uses: actions/upload-artifact@v4
        with:
          name: canonical-build-manifest
          path: ci_meta/build_manifest.json
          retention-days: 14

  android_build_distribute:
    name: Android Build + Firebase Distribution
    needs: prepare
    runs-on: ubuntu-latest
    outputs:
      android_version_code: ${{ steps.android_meta.outputs.android_version_code }}
    env:
      BUILD_NUMBER: ${{ needs.prepare.outputs.ci_build_number }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || 'hagere-663c4' }}
      FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: stable
          cache: true

      - name: Cache Dart pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install dependencies
        run: flutter pub get

      - name: Resolve Firebase Android app ID
        id: firebase_android_app
        env:
          FIREBASE_ANDROID_APP_ID_SECRET: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
        run: |
          APP_ID_FROM_JSON="$(jq -r '.client[] | select(.client_info.android_client_info.package_name=="com.digitalnebi.allhabesha") | .client_info.mobilesdk_app_id' android/app/google-services.json | head -n1)"
          FIREBASE_ANDROID_APP_ID="${APP_ID_FROM_JSON:-$FIREBASE_ANDROID_APP_ID_SECRET}"
          if [[ -z "$FIREBASE_ANDROID_APP_ID" || "$FIREBASE_ANDROID_APP_ID" == "null" ]]; then
            echo "Unable to resolve Firebase Android app id for com.digitalnebi.allhabesha"
            exit 1
          fi
          echo "firebase_android_app_id=$FIREBASE_ANDROID_APP_ID" >> "$GITHUB_OUTPUT"

      - name: Validate Android release secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS FIREBASE_TOKEN; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-release-key.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=my-release-key.jks
          EOF

      - name: Build Android AAB + APK
        run: |
          run_android_release_builds() {
            flutter build appbundle --release --build-number "$BUILD_NUMBER"
            flutter build apk --release --build-number "$BUILD_NUMBER"
          }

          set +e
          run_android_release_builds 2>&1 | tee /tmp/android_build_attempt1.log
          build_status=${PIPESTATUS[0]}
          set -e

          if [[ "$build_status" -ne 0 ]]; then
            echo "::warning::Android release build failed on first attempt. Retrying once after clean."
            flutter clean
            flutter pub get
            set +e
            run_android_release_builds 2>&1 | tee /tmp/android_build_attempt2.log
            build_status=${PIPESTATUS[0]}
            set -e
          fi

          if [[ "$build_status" -ne 0 ]]; then
            {
              echo "=== Android build attempt 1 (tail) ==="
              tail -n 120 /tmp/android_build_attempt1.log
              echo
              echo "=== Android build attempt 2 (tail) ==="
              tail -n 120 /tmp/android_build_attempt2.log
            } > /tmp/android_build_failure_tail.log
            cat /tmp/android_build_failure_tail.log
            echo "::error::Android release build failed after retry. See android-build-debug-logs artifact."
            exit 1
          fi

      - name: Capture Android build metadata
        id: android_meta
        run: |
          METADATA_PATH=""
          if [[ -f "build/app/outputs/flutter-apk/output-metadata.json" ]]; then
            METADATA_PATH="build/app/outputs/flutter-apk/output-metadata.json"
          elif [[ -f "build/app/outputs/apk/release/output-metadata.json" ]]; then
            METADATA_PATH="build/app/outputs/apk/release/output-metadata.json"
          fi

          if [[ -n "$METADATA_PATH" ]]; then
            ANDROID_VERSION_CODE="$(jq -r '.elements[0].versionCode' "$METADATA_PATH")"
          else
            ANDROID_VERSION_CODE="$BUILD_NUMBER"
          fi

          echo "android_version_code=$ANDROID_VERSION_CODE" >> "$GITHUB_OUTPUT"
          mkdir -p ci_meta
          cat > ci_meta/android_manifest.json <<EOF
          {
            "ci_build_number": "$BUILD_NUMBER",
            "android_version_code": "$ANDROID_VERSION_CODE",
            "app_version": "${{ needs.prepare.outputs.app_version }}",
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}"
          }
          EOF

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Distribute to Firebase testers + automated device tests
        run: |
          set +e
          firebase --project "$FIREBASE_PROJECT_ID" appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
            --app "${{ steps.firebase_android_app.outputs.firebase_android_app_id }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --test-devices-file scripts/firebase_test_devices_android.txt | tee /tmp/firebase_distribution.log
          status=$?
          set -e

          if [[ "$status" -ne 0 ]]; then
            if grep -q "View this release in the Firebase console" /tmp/firebase_distribution.log; then
              echo "Firebase distribution succeeded, but automated device crawl reported failures."
              echo "Continuing CI while keeping this warning visible in logs."
            else
              exit "$status"
            fi
          fi

      - name: Upload Android build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/output-metadata.json
            build/app/outputs/apk/release/output-metadata.json
            ci_meta/android_manifest.json
          retention-days: 14

      - name: Upload Android build debug logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-debug-logs
          path: |
            /tmp/android_build_attempt1.log
            /tmp/android_build_attempt2.log
            /tmp/android_build_failure_tail.log
          if-no-files-found: ignore
          retention-days: 14

  ios_build_distribute:
    name: iOS Build + OTA Publish
    needs: prepare
    runs-on: macos-latest
    env:
      CI_BUILD_NUMBER: ${{ needs.prepare.outputs.ci_build_number }}
      IOS_OTA_PROFILE_AVAILABLE: ${{ secrets.IOS_ADHOC_PROVISIONING_PROFILE_BASE64 != '' && '1' || '0' }}
      IOS_ENABLE_TESTFLIGHT: ${{ vars.IOS_ENABLE_TESTFLIGHT || '1' }}
      IOS_OTA_S3_BUCKET: ${{ vars.IOS_OTA_S3_BUCKET || 'agerelige-user-images1' }}
      IOS_OTA_S3_KEY: ${{ vars.IOS_OTA_S3_KEY || 'allhabesha/ios/Runner_1770808126.ipa' }}
      IOS_OTA_AWS_REGION: ${{ vars.IOS_OTA_AWS_REGION || 'us-east-2' }}
      IOS_OTA_EMAIL_AWS_REGION: ${{ vars.IOS_OTA_EMAIL_AWS_REGION || 'us-east-1' }}
      IOS_OTA_INSTALL_URL: ${{ vars.IOS_OTA_INSTALL_URL || 'https://www.digitalnebi.com/allhabesha.html' }}
      IOS_OTA_EMAIL_FROM: ${{ vars.IOS_OTA_EMAIL_FROM || 'apple@digitalnebi.com' }}
      IOS_OTA_EMAIL_TO: ${{ vars.IOS_OTA_EMAIL_TO || 'nebyate@gmail.com' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: stable
          cache: true

      - name: Cache Dart pub packages
        if: env.IOS_OTA_PROFILE_AVAILABLE == '1'
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set up Ruby
        if: env.IOS_OTA_PROFILE_AVAILABLE == '1'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      - name: Install Flutter dependencies
        if: env.IOS_OTA_PROFILE_AVAILABLE == '1'
        run: flutter pub get

      - name: Validate iOS release secrets
        if: env.IOS_OTA_PROFILE_AVAILABLE == '1'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 || secrets.IOS_MOBILEPROVISION_BASE64 }}
        run: |
          missing=0
          for name in IOS_CERTIFICATE_P12_BASE64 IOS_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Configure iOS signing keychain and profile
        if: env.IOS_OTA_PROFILE_AVAILABLE == '1'
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 || secrets.IOS_MOBILEPROVISION_BASE64 }}
          IOS_ADHOC_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_ADHOC_PROVISIONING_PROFILE_BASE64 || '' }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="${IOS_KEYCHAIN_PASSWORD:-ci-temporary-keychain-password}"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/ci.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/ci.mobileprovision.plist"
          IOS_PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/ci.mobileprovision.plist")"
          IOS_PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/ci.mobileprovision.plist")"
          IOS_TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/ci.mobileprovision.plist" | cut -d'.' -f1)"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          {
            echo "IOS_PROVISIONING_PROFILE_NAME=$IOS_PROFILE_NAME"
            echo "IOS_PROVISIONING_PROFILE_UUID=$IOS_PROFILE_UUID"
            echo "IOS_DEVELOPMENT_TEAM=$IOS_TEAM_ID"
          } >> "$GITHUB_ENV"
          if [[ -n "${IOS_ADHOC_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            ADHOC_PROFILE_PATH="$HOME/Library/MobileDevice/Provisioning Profiles/ci_adhoc.mobileprovision"
            echo "$IOS_ADHOC_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$ADHOC_PROFILE_PATH"
            security cms -D -i "$ADHOC_PROFILE_PATH" > "$RUNNER_TEMP/ci_adhoc.mobileprovision.plist"
            IOS_ADHOC_PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/ci_adhoc.mobileprovision.plist")"
            IOS_ADHOC_PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/ci_adhoc.mobileprovision.plist")"
            cp "$ADHOC_PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_ADHOC_PROFILE_UUID.mobileprovision"
            {
              echo "IOS_ADHOC_PROVISIONING_PROFILE_NAME=$IOS_ADHOC_PROFILE_NAME"
              echo "IOS_ADHOC_PROVISIONING_PROFILE_UUID=$IOS_ADHOC_PROFILE_UUID"
              echo "IOS_OTA_PROFILE_READY=1"
            } >> "$GITHUB_ENV"
          else
            {
              echo "IOS_ADHOC_PROVISIONING_PROFILE_NAME="
              echo "IOS_ADHOC_PROVISIONING_PROFILE_UUID="
              echo "IOS_OTA_PROFILE_READY=0"
            } >> "$GITHUB_ENV"
          fi

      - name: Cache CocoaPods
        if: env.IOS_OTA_PROFILE_AVAILABLE == '1'
        id: cocoapods_cache
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Install CocoaPods
        if: env.IOS_OTA_PROFILE_AVAILABLE == '1'
        run: |
          cd ios
          if [[ "${{ steps.cocoapods_cache.outputs.cache-hit }}" == "true" ]] && [[ -f "Pods/Manifest.lock" ]] && cmp -s "Podfile.lock" "Pods/Manifest.lock"; then
            echo "CocoaPods sandbox already in sync. Skipping pod install."
            exit 0
          fi

          set +e
          LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 pod install --deployment
          status=$?
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "::warning::pod install --deployment failed due lock drift. Retrying with regular pod install."
            LANG=en_US.UTF-8 LC_ALL=en_US.UTF-8 pod install
          fi

      - name: Build Ad Hoc IPA for OTA install
        if: env.IOS_OTA_PROFILE_READY == '1'
        env:
          IOS_ADHOC_PROVISIONING_PROFILE_NAME: ${{ env.IOS_ADHOC_PROVISIONING_PROFILE_NAME }}
          IOS_DEVELOPMENT_TEAM: ${{ env.IOS_DEVELOPMENT_TEAM }}
          CI_BUILD_NUMBER: ${{ env.CI_BUILD_NUMBER }}
          IOS_SKIP_BUILD_NUMBER_INCREMENT: "1"
        run: |
          cd ios
          bundle exec fastlane ios adhoc_ipa

      - name: Validate TestFlight secrets
        if: env.IOS_OTA_PROFILE_AVAILABLE == '1' && env.IOS_ENABLE_TESTFLIGHT == '1'
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
        run: |
          missing=0
          for name in ASC_ISSUER_ID ASC_KEY_ID ASC_KEY_CONTENT_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Upload same CI build to TestFlight
        if: env.IOS_OTA_PROFILE_AVAILABLE == '1' && env.IOS_ENABLE_TESTFLIGHT == '1'
        env:
          CI_BUILD_NUMBER: ${{ env.CI_BUILD_NUMBER }}
          CI_WAIT_FOR_TESTFLIGHT_PROCESSING: "1"
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
        run: |
          cd ios
          bundle exec fastlane ios beta

      - name: Evaluate OTA publish readiness
        id: ota_publish_ready
        env:
          IOS_OTA_AWS_ACCESS_KEY_ID: ${{ secrets.IOS_OTA_AWS_ACCESS_KEY_ID || '' }}
          IOS_OTA_AWS_SECRET_ACCESS_KEY: ${{ secrets.IOS_OTA_AWS_SECRET_ACCESS_KEY || '' }}
        run: |
          ready=0
          if [[ "${IOS_OTA_PROFILE_READY}" == "1" ]] && [[ -n "${IOS_OTA_AWS_ACCESS_KEY_ID}" ]] && [[ -n "${IOS_OTA_AWS_SECRET_ACCESS_KEY}" ]]; then
            ready=1
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials for OTA IPA publish
        if: steps.ota_publish_ready.outputs.ready == '1'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.IOS_OTA_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.IOS_OTA_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.IOS_OTA_AWS_REGION }}

      - name: Publish Ad Hoc IPA to stable OTA path
        if: steps.ota_publish_ready.outputs.ready == '1'
        run: |
          aws s3 cp ios/Runner-AdHoc.ipa "s3://${IOS_OTA_S3_BUCKET}/${IOS_OTA_S3_KEY}" \
            --metadata "ci_build_number=${CI_BUILD_NUMBER}" \
            --content-type application/octet-stream \
            --cache-control no-store
          {
            echo "### iOS OTA Link Updated"
            echo "- Install page: \`${IOS_OTA_INSTALL_URL}\`"
            echo "- Artifact: \`s3://${IOS_OTA_S3_BUCKET}/${IOS_OTA_S3_KEY}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Email iOS OTA install link
        if: steps.ota_publish_ready.outputs.ready == '1' && env.IOS_OTA_EMAIL_TO != '' && env.IOS_OTA_EMAIL_FROM != ''
        run: |
          email_subject="AllHabesha iOS install link updated (${CI_BUILD_NUMBER})"
          email_body="$(cat <<EOF
          Open on iPhone Safari:
          ${IOS_OTA_INSTALL_URL}

          Direct:
          https://www.digitalnebi.com/allhabesha.plist
          https://www.digitalnebi.com/allhabesha.ipa

          Build: ${CI_BUILD_NUMBER}
          Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          )"
          email_content="$(jq -nc --arg subject "$email_subject" --arg body "$email_body" '{Simple:{Subject:{Data:$subject},Body:{Text:{Data:$body}}}}')"

          set +e
          aws sesv2 send-email \
            --region "${IOS_OTA_EMAIL_AWS_REGION}" \
            --from-email-address "${IOS_OTA_EMAIL_FROM}" \
            --destination "ToAddresses=${IOS_OTA_EMAIL_TO}" \
            --content "${email_content}" \
            | tee /tmp/ios_ota_email_send.json
          status=${PIPESTATUS[0]}
          set -e

          if [[ "$status" -ne 0 ]]; then
            echo "::warning::OTA email send failed."
          else
            message_id="$(jq -r '.MessageId // empty' /tmp/ios_ota_email_send.json 2>/dev/null || true)"
            {
              echo "- OTA email sent to: \`${IOS_OTA_EMAIL_TO}\`"
              echo "- OTA email MessageId: \`${message_id:-unknown}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Note OTA publish prerequisites
        if: steps.ota_publish_ready.outputs.ready != '1'
        run: |
          {
            echo "### iOS OTA Link Not Updated In This Run"
            echo "- Required secrets:"
            echo "  - IOS_ADHOC_PROVISIONING_PROFILE_BASE64"
            echo "  - IOS_OTA_AWS_ACCESS_KEY_ID"
            echo "  - IOS_OTA_AWS_SECRET_ACCESS_KEY"
            echo "- Target install page: \`${IOS_OTA_INSTALL_URL}\`"
            echo "- OTA email target: \`${IOS_OTA_EMAIL_TO}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Capture iOS build metadata
        run: |
          OTA_PUBLISHED="false"
          if [[ -f "ios/Runner-AdHoc.ipa" ]]; then
            OTA_PUBLISHED="true"
          fi
          mkdir -p ci_meta
          cat > ci_meta/ios_manifest.json <<EOF
          {
            "ci_build_number": "${CI_BUILD_NUMBER}",
            "app_version": "${{ needs.prepare.outputs.app_version }}",
            "bundle_id": "com.digitalnebi.allhabesha",
            "ota_install_url": "${IOS_OTA_INSTALL_URL}",
            "ota_published": ${OTA_PUBLISHED},
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}"
          }
          EOF

      - name: Upload iOS metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-manifest
          path: ci_meta/ios_manifest.json
          retention-days: 14

  promote_production:
    name: Manual Approval -> Promote Exact CI Build
    needs:
      - prepare
      - android_build_distribute
      - ios_build_distribute
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download canonical manifest
        uses: actions/download-artifact@v4
        with:
          name: canonical-build-manifest
          path: dist/meta

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-artifacts
          path: dist/android

      - name: Download iOS manifest
        uses: actions/download-artifact@v4
        with:
          name: ios-release-manifest
          path: dist/ios

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: ios

      - name: Install iOS Ruby gems for promotion
        run: |
          cd ios
          bundle check || bundle install

      - name: Validate production promotion secrets
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
        run: |
          missing=0
          for name in PLAY_SERVICE_ACCOUNT_JSON_BASE64 ASC_KEY_CONTENT_BASE64; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: $name"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Decode Play service account key
        env:
          PLAY_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          echo "$PLAY_SERVICE_ACCOUNT_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/play-service-account.json"

      - name: Promote same Android AAB to production
        run: |
          cd ios
          bundle exec fastlane run upload_to_play_store \
            package_name:"com.digitalnebi.allhabesha" \
            json_key:"$RUNNER_TEMP/play-service-account.json" \
            aab:"$GITHUB_WORKSPACE/dist/android/build/app/outputs/bundle/release/app-release.aab" \
            track:"production" \
            release_status:"completed" \
            skip_upload_metadata:true \
            skip_upload_images:true \
            skip_upload_screenshots:true \
            skip_upload_changelogs:true \
            timeout:600

      - name: Submit same iOS build for App Review
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          ASC_APP_VERSION: ${{ needs.prepare.outputs.app_version }}
          ASC_BUILD_NUMBER: ${{ needs.prepare.outputs.ci_build_number }}
        run: |
          cd ios

          max_attempts=10
          wait_seconds=90
          attempt=1
          submitted=0
          skipped_existing_submission=0

          while [[ "$attempt" -le "$max_attempts" ]]; do
            set +e
            bundle exec fastlane ios submit_ci_build_for_review 2>&1 | tee /tmp/ios_submit_for_review.log
            status=${PIPESTATUS[0]}
            set -e

            if [[ "$status" -eq 0 ]]; then
              submitted=1
              break
            fi

            if grep -Eq "Cannot submit for review - A review submission is already in progress" /tmp/ios_submit_for_review.log; then
              echo "::warning::iOS submit skipped due to existing App Store Connect review/submission state."
              skipped_existing_submission=1
              break
            fi

            if grep -Eq "Build number: .* does not exist|No build found|Could not find build|Could not locate build" /tmp/ios_submit_for_review.log; then
              if [[ "$attempt" -lt "$max_attempts" ]]; then
                echo "::warning::App Store Connect has not exposed iOS build ${ASC_BUILD_NUMBER} yet (attempt ${attempt}/${max_attempts}). Retrying in ${wait_seconds}s."
                sleep "$wait_seconds"
                attempt=$((attempt + 1))
                continue
              fi
            fi

            exit "$status"
          done

          if [[ "$submitted" -eq 1 ]]; then
            echo "IOS_SUBMIT_STATE=submitted" >> "$GITHUB_ENV"
          elif [[ "$skipped_existing_submission" -eq 1 ]]; then
            echo "IOS_SUBMIT_STATE=skipped_existing_submission_state" >> "$GITHUB_ENV"
          else
            echo "::error::iOS submit failed after retries."
            exit 1
          fi

      - name: Summarize canonical promotion
        run: |
          {
            echo "### Canonical Promotion Completed"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- CI build number: \`${{ needs.prepare.outputs.ci_build_number }}\`"
            echo "- Android versionCode: \`${{ needs.android_build_distribute.outputs.android_version_code }}\`"
            echo "- iOS build number: \`${{ needs.prepare.outputs.ci_build_number }}\`"
            echo "- iOS submit state: \`${IOS_SUBMIT_STATE:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"
